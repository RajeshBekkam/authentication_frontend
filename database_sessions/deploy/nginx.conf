# Example production reverse proxy (PRD 4.2, SR-4, SR-5): one HTTPS origin serves the SPA build
# and proxies /api/* to the ASP.NET Core backend, so the __Host-sid cookie stays same-origin.
# IIS or YARP work equally well; keep the same three rules: same origin, CSP, no source maps.

server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.com;

    ssl_certificate     /etc/ssl/certs/auth.example.com.pem;
    ssl_certificate_key /etc/ssl/private/auth.example.com.key;

    root /usr/share/nginx/html;   # contents of `npm run build` (dist/)
    index index.html;

    # API: pass through untouched. The API sends its own restrictive headers.
    location /api/ {
        proxy_pass         http://127.0.0.1:5154;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Never serve source maps, even if one slips into a build.
    location ~* \.map$ {
        return 404;
    }

    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routes fall back to index.html.
    location / {
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name auth.example.com;
    return 301 https://$host$request_uri;
}
